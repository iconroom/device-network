<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Network Device Control Hub</title>
    <style>
        body { font-family: monospace; background: #0f172a; color: #f8fafc; margin: 20px; }
        h2, h3 { color: #38bdf8; }
        ul { list-style-type: none; padding: 0; }
        li { background: #1e293b; padding: 10px; margin-bottom: 5px; border-radius: 4px; border-left: 4px solid #38bdf8; }
        input, button { padding: 10px; margin: 5px 0; background: #1e293b; border: 1px solid #334155; color: #fff; border-radius: 4px; }
        button { background: #0284c7; cursor: pointer; font-weight: bold; }
        button:hover { background: #0369a1; }
        #output { background: #020617; color: #4ade80; padding: 15px; border-radius: 6px; height: 300px; overflow-y: auto; border: 1px solid #1e293b; white-space: pre-wrap; }
    </style>
</head>
<body>
    <h2>Connected Devices</h2>
    <ul id="deviceList"><li>Waiting for devices to register...</li></ul>
    
    <h3>Remote Execution Console</h3>
    <div>
        <input type="text" id="targetId" placeholder="Target Device ID">
        <input type="text" id="cmd" placeholder="Command (e.g. ls -la, uptime)">
        <button onclick="sendCommand()">Execute Command</button>
    </div>
    
    <h3>Execution Logs</h3>
    <pre id="output">// Real-time command responses will appear here...</pre>

    <script>
        const protocol = location.protocol === 'https:' ? 'wss://' : 'ws://';
        const ws = new WebSocket(`${protocol}${location.host}`);

        ws.onmessage = (event) => {
            const data = JSON.parse(event.data);
            if (data.type === 'device_list') {
                const list = document.getElementById('deviceList');
                if (data.devices.length === 0) {
                    list.innerHTML = '<li>No active target devices connected.</li>';
                } else {
                    list.innerHTML = data.devices.map(d => 
                        `<li><b>ID:</b> ${d.id} | <b>Platform:</b> ${d.info.platform} (${d.info.arch}) | <b>Uptime:</b> ${Math.floor(d.info.uptime / 3600)}h</li>`
                    ).join('');
                }
            }
            if (data.type === 'log') {
                const output = document.getElementById('output');
                output.innerText += `\n[${new Date().toLocaleTimeString()}] [${data.deviceId}]:\n${data.result}\n----------------------------------------`;
                output.scrollTop = output.scrollHeight;
            }
        };

        function sendCommand() {
            const targetId = document.getElementById('targetId').value.trim();
            const command = document.getElementById('cmd').value.trim();
            if (!targetId || !command) return alert('Provide target ID and command');
            ws.send(JSON.stringify({ type: 'command', targetId, command }));
            document.getElementById('cmd').value = '';
        }
    </script>
</body>
</html>
